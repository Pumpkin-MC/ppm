name: Nightly Release

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Compare main with the nightly tag
        id: check
        run: |
          LAST=$(git ls-remote "https://github.com/${{ github.repository }}" refs/tags/nightly | cut -f1)
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ github.event_name }}" == "push" ] || [ "$LAST" != "${{ github.sha }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build release
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: ppm-X64-Linux
          - os: ubuntu-latest
            asset: ppm-X64-Linux-musl
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            asset: ppm-ARM64-Linux
          - os: windows-latest
            asset: ppm-X64-Windows.exe
          - os: macos-latest
            asset: ppm-ARM64-macOS
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Add musl target
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.asset }}
      - name: Build release
        shell: bash
        run: cargo build --verbose --release ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ runner.os }}" == "Windows" ]; then EXT=".exe"; fi
          DIR="target/release"
          if [ -n "${{ matrix.target }}" ]; then DIR="target/${{ matrix.target }}/release"; fi
          cp "$DIR/ppm$EXT" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          compression-level: 9
          path: dist/${{ matrix.asset }}

  publish_release:
    name: Publish nightly release
    permissions:
      contents: write
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download prebuilt binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "ppm-*"
          path: dist/
          merge-multiple: true
      - name: Generate release notes
        run: |
          echo "### Pumpkin Package Manager (ppm) Nightly Build" > dist/RELEASE.md
          echo "" >> dist/RELEASE.md
          echo "- Commit: [\`${{ github.sha }}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> dist/RELEASE.md
          echo "- Built on: $(date -u +"%Y-%m-%d %H:%M") UTC" >> dist/RELEASE.md
          cat dist/RELEASE.md
      - name: Update the nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag --force nightly && git push --force origin tag nightly
      - name: Publish nightly GitHub release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: dist/ppm*
          tag_name: nightly
          name: Nightly Build
          body_path: dist/RELEASE.md

  publish_aur:
    name: Publish to the AUR
    needs: [publish_release]
    uses: ./.github/workflows/aur-publish.yml
    secrets: inherit
